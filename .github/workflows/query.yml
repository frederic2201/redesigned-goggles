name: Query VPS

on:
  workflow_dispatch:
    inputs:
      command:
        description: 'Command to run on VPS'
        required: true
        type: string

jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - name: Run via API
        env:
          CMD: ${{ inputs.command }}
        run: |
          curl -s -X POST http://168.231.81.67:3000/api/admin/exec \
            -H "Authorization: Bearer ${{ secrets.ADMIN_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"command\": $(printf '%s' "$CMD" | jq -Rs .)}" \
            --max-time 60
