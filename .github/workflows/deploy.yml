name: Deploy to VPS

on:
  push:
    branches: [main]
    paths:
      - 'js/**'
      - 'src/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy JS files to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 168.231.81.67
          username: root
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            cd /var/www/cizo/public/js
            curl -sf -o stock.js https://raw.githubusercontent.com/frederic2201/redesigned-goggles/main/js/stock.js
            curl -sf -o nav.js https://raw.githubusercontent.com/frederic2201/redesigned-goggles/main/js/nav.js
            curl -sf -o api.js https://raw.githubusercontent.com/frederic2201/redesigned-goggles/main/js/api.js
            pm2 restart cizo
            echo "JS deployed OK"

      - name: Deploy backend src files
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 168.231.81.67
          username: root
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            cd /var/www/cizo/src
            for f in $(ls /var/www/cizo/src/*.js 2>/dev/null | xargs -n1 basename); do
              curl -sf -o "$f" "https://raw.githubusercontent.com/frederic2201/redesigned-goggles/main/src/$f" || true
            done
            pm2 restart cizo
            pm2 status
