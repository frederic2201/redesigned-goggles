name: GCal Import VPS
on:
  workflow_dispatch:
jobs:
  gcal-import:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger GCal import
        run: |
          curl -s -X POST http://168.231.81.67:3000/api/admin/gcal-import \
            -H "Authorization: Bearer ${{ secrets.ADMIN_TOKEN }}" \
            -H "Content-Type: application/json" \
            --max-time 60
